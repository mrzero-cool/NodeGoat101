name: AppSec Scanner
# Runs SAST (Semgrep), SCA (Trivy), and IaC (Terrascan) scans

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  scan:
    name: Run SAST / SCA / IaC scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - id: semgrep
        name: Install + Run Semgrep SAST
        run: |
          set -e -o pipefail
          python -m pip install --upgrade pip
          pip install semgrep --quiet
          # run semgrep; capture exit code and set step output `issues=true` if non-zero
          SEMG_EXIT=0
          semgrep scan --config auto . || SEMG_EXIT=$?
          if [ "$SEMG_EXIT" -ne 0 ]; then
            echo "Semgrep found issues (exit code $SEMG_EXIT)"
            echo "issues=true" >> $GITHUB_OUTPUT
          else
            echo "issues=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - id: terrascan
        name: Install + Run Terrascan IaC Scan
        run: |
          set -e -o pipefail
          API_JSON="$(curl -s https://api.github.com/repos/tenable/terrascan/releases/latest)"
          TAR_URL="$(echo "$API_JSON" | grep -o -E "https://.+?/terrascan_.*_Linux_x86_64.tar.gz" | head -n1)"
          if [ -z "$TAR_URL" ]; then
            echo "Could not find terrascan Linux x86_64 asset in release metadata; skipping install"
            echo "issues=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          curl -sL "$TAR_URL" -o terrascan.tar.gz
          tar -xzf terrascan.tar.gz
          sudo install -m 0755 terrascan /usr/local/bin/ || sudo mv terrascan /usr/local/bin/terrascan
          rm -f terrascan terrascan.tar.gz
          # run terrascan; capture exit code and set step output `issues=true` if non-zero
          TERRA_EXIT=0
          terrascan scan . || TERRA_EXIT=$?
          if [ "$TERRA_EXIT" -ne 0 ]; then
            echo "Terrascan found issues (exit code $TERRA_EXIT)"
            echo "issues=true" >> $GITHUB_OUTPUT
          else
            echo "issues=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - id: trivy
        name: Install + Run Trivy SCA Scan (filesystem)
        run: |
          set -e -o pipefail
          # produce JSON output for policy evaluation
          /usr/local/bin/trivy fs --format json -o trivy.json .
        shell: bash

      - name: Install OPA CLI
        run: |
          set -e -o pipefail
          OPA_VERSION="v0.49.0"
          curl -fsSL "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64" -o opa
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version
        shell: bash

      - name: Evaluate Trivy JSON with OPA policy (fail on HIGH/CRITICAL)
        run: |
          set -e -o pipefail
          # ensure policy file exists
          if [ ! -f ./policy/trivy_deny.rego ]; then
            echo "policy/trivy_deny.rego not found — create it at repo root policy/trivy_deny.rego"
            exit 1
          fi

          # Evaluate the policy against trivy.json
          echo "Running OPA policy against trivy.json..."
          RES=$(opa eval -i trivy.json -d policy/trivy_deny.rego 'data.trivy.deny' --format json)

          # If result array is empty, there are no denies:
          if echo "$RES" | grep -q '"result":\s*\[\s*\]'; then
            echo "No policy violations found (no HIGH/CRITICAL vulnerabilities)."
          else
            echo "Policy violations found — failing the pipeline."
            echo "OPA result:"
            echo "$RES" | jq . || echo "$RES"
            # fail the job
            exit 1
          fi
        shell: bash

