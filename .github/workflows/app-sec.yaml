name: Trivy SCA + OPA policy check

# trigger on any push or PR (no branch names)
on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  trivy:
    name: Run Trivy and fail on HIGH/CRITICAL via OPA
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          set -e -o pipefail
          # official installer to /usr/local/bin
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
        shell: bash

      - name: Run Trivy (JSON output)
        id: trivy_run
        run: |
          set -e -o pipefail
          # produce deterministic JSON output for policy evaluation
          # use --exit-code 0 so Trivy never fails the job on its own findings
          /usr/local/bin/trivy fs --format json --exit-code 0 -o trivy.json .
          echo "::debug::Trivy JSON saved to trivy.json"
          # show a short summary for logs (non-failing)
          /usr/local/bin/trivy fs --format table --exit-code 0 .
        shell: bash

      - name: Install OPA CLI
        run: |
          set -e -o pipefail
          OPA_VERSION="v0.49.0"
          curl -fsSL "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64" -o opa
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version
        shell: bash

      - name: Evaluate Trivy JSON with OPA policy (fail on HIGH/CRITICAL)
        run: |
          set -e -o pipefail
          # ensure policy exists
          if [ ! -f ./policy/trivy_deny.rego ]; then
            echo "policy/trivy_deny.rego not found at ./policy/trivy_deny.rego"
            echo "Create the policy file (see policy/trivy_deny.rego example)."
            exit 1
          fi

          if [ ! -s trivy.json ]; then
            echo "trivy.json is empty or missing — skipping OPA check (no input)."
            exit 0
          fi

          echo "Evaluating policy against trivy.json..."
          OPA_OUT=$(opa eval -i trivy.json -d ./policy/trivy_deny.rego 'data.trivy.deny' --format json) || true
          echo "OPA output:"
          echo "$OPA_OUT" | jq . || echo "$OPA_OUT"

          # if result array is empty -> no denies
          EMPTY=$(echo "$OPA_OUT" | jq -e '.result | length == 0' || true)
          if [ "$EMPTY" = "true" ]; then
            echo "No policy violations found (no HIGH/CRITICAL vulnerabilities per policy)."
          else
            echo "Policy violations found (HIGH/CRITICAL vulnerabilities) — failing the job."
            # print each deny message if present
            echo "Violations:"
            echo "$OPA_OUT" | jq -r '.result[].expressions[].value[]' || true
            exit 1
          fi
        shell: bash

      - name: Final summary
        if: ${{ always() }}
        run: |
          set -e -o pipefail
          echo "Workflow finished. Check above logs for Trivy and OPA details."
        shell: bash
